name: postgres-performance-lab

services:
  api:
    build: .
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-performance_lab}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab-local-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-0.25}
      ANALYTICS_CACHE_ENABLED: ${ANALYTICS_CACHE_ENABLED:-true}
      ANALYTICS_CACHE_TTL: ${ANALYTICS_CACHE_TTL:-60}
      ANALYTICS_CACHE_WAIT: ${ANALYTICS_CACHE_WAIT:-5}
      ANALYTICS_CACHE_NAMESPACE: ${ANALYTICS_CACHE_NAMESPACE:-lab}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      API_PROFILING_ENABLED: ${API_PROFILING_ENABLED:-false}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      HEALTHCHECK_TIMEOUT: ${HEALTHCHECK_TIMEOUT:-2}
      LAB_MODE: ${LAB_MODE:-false}
      LAB_ALLOW_DOCKER_GATEWAY: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8008}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=4).close()"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    cpus: 1.0
    mem_limit: 512m

  postgres:
    image: postgres:16
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "timezone=UTC"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-performance_lab}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab-local-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    cpus: 2.0
    mem_limit: 2g

  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    cpus: 0.5
    mem_limit: 256m

volumes:
  postgres_data:
  redis_data:
