name: postgres-performance-lab

services:
  api:
    build: .
    cgroup: private
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-performance_lab}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab-local-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-0.25}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-64}
      ANALYTICS_CACHE_ENABLED: ${ANALYTICS_CACHE_ENABLED:-true}
      ANALYTICS_CACHE_TTL: ${ANALYTICS_CACHE_TTL:-60}
      ANALYTICS_CACHE_WAIT: ${ANALYTICS_CACHE_WAIT:-5}
      ANALYTICS_CACHE_NAMESPACE: ${ANALYTICS_CACHE_NAMESPACE:-lab}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      API_PROFILING_ENABLED: ${API_PROFILING_ENABLED:-false}
      API_METRICS_ENABLED: ${API_METRICS_ENABLED:-true}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      HEALTHCHECK_TIMEOUT: ${HEALTHCHECK_TIMEOUT:-2}
      LAB_MODE: ${LAB_MODE:-false}
      LAB_ALLOW_DOCKER_GATEWAY: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8008}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=4).close()"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    cpus: 1.0
    mem_limit: 512m

  postgres:
    image: postgres:16
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "timezone=UTC"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-performance_lab}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab-local-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    cpus: 2.0
    mem_limit: 2g

  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    cpus: 0.5
    mem_limit: 256m

  postgres-monitoring-init:
    image: postgres:16
    profiles: [monitoring]
    user: postgres
    entrypoint: ["psql", "-X", "--set=ON_ERROR_STOP=1", "--file=/monitoring.sql"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-performance_lab}
      PGUSER: ${POSTGRES_USER:-lab}
      PGPASSWORD: ${POSTGRES_PASSWORD:-lab-local-password}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:-lab-exporter-password}
    volumes:
      - ./infra/postgres/monitoring.sql:/monitoring.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 64m

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [monitoring]
    command:
      - --collector.stat_statements
      - --no-collector.stat_statements.include_query
      - --collector.stat_statements.limit=50
      - --collector.stat_statements.exclude_users=lab_metrics
    environment:
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB:-performance_lab}?sslmode=disable"
      DATA_SOURCE_USER: lab_metrics
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:-lab-exporter-password}
    depends_on:
      postgres-monitoring-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9187/"]
      interval: 5s
      timeout: 3s
      retries: 5
    cpus: 0.25
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v3.13.5
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9098}:9090"
    depends_on:
      api:
        condition: service_healthy
      postgres-exporter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready", "--url=http://127.0.0.1:9090"]
      interval: 5s
      timeout: 3s
      retries: 5
    cpus: 0.5
    mem_limit: 384m

  grafana:
    image: grafana/grafana:12.4.15
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-lab-grafana-password}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3008}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    cpus: 0.5
    mem_limit: 384m

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
